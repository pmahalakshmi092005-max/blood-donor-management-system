{% extends 'base.html' %}

{% block title %}Page Not Found (404) - Blood Donor System{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card card-custom p-5 my-4">
                <div class="display-1 fw-bold text-danger mb-3">404</div>
                <h3 class="fw-bold text-dark mb-2">Page Not Found</h3>
                <p class="text-muted mb-4">
                    The donor profile, resource, or page you are looking for does not exist or may have been moved.
                </p>
                <div class="d-flex justify-content-center gap-3">
                    <a href="{% url 'home' %}" class="btn btn-primary-red">
                        <i class="bi bi-house-door-fill me-1"></i> Return Home
                    </a>
                    <a href="{% url 'donor_list' %}" class="btn btn-outline-secondary">
                        <i class="bi bi-people-fill me-1"></i> View Donors
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
